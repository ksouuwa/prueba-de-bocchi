<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kessoku Band Reproductor</title>
    <style>
        /* === IMPORTACIÓN DE FUENTE JAPONESA === */
        @font-face {
            font-family: 'NaishoMoji';
            src: local('Naisho Moji'), 
                 local('NaishoMojiRegular'),
                 url('NaishoMojiRegular.otf') format('opentype'); 
        }	

        body {
            background-image: url('FONDO DE T ODO.jpg'); 
            background-size: cover;       
            background-position: center;  
            background-attachment: fixed; 
            
            color: white;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            
            height: 100vh;             
            overflow-x: hidden;          
            
            /* Estructura Grid en computadoras */
            display: grid;
            grid-template-columns: 1fr auto; 
            align-items: center;
            justify-items: center;
            box-sizing: border-box;
            padding-right: 40px; 
        }

        /* Contenedor central (Logotipo e integrantes) */
        .contenido-principal {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-bottom: 30px; 
            grid-column: 1; 
        }
        
        .logo-titulo {
            height: 230px; 
            object-fit: contain;
            margin-bottom: 5px; 
            filter: none; 
        }

        /* Configuración de las letras japonesas en PC */
        .texto-vertical-derecha {
            font-family: 'NaishoMoji', 'Arial Black', sans-serif; 
            font-size: 5.5rem;          
            letter-spacing: 25px;       
            color: #fffb00;             
            text-shadow: 0 0 8px rgba(255, 251, 0, 0.6);
            
            writing-mode: vertical-rl; 
            text-orientation: upright; 
            
            grid-column: 2; 
            margin-left: 35px;          
            align-self: center;
        }

        /* Ajuste de escala para el Kana en PC */
        .texto-vertical-derecha span {
            display: inline-block;
            transform: scale(0.75);     
            transform-origin: center;
            margin-top: -10px;          
        }
        
        .banda-container {
            display: flex;
            justify-content: center;
            gap: 20px; 
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .tarjeta-miembro {
            display: inline-block;
            padding: 10px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            border-radius: 10px;
            background-color: #1a1a1a;
        }

        .tarjeta-miembro:hover {
            transform: scale(1.05); 
        }

        /* Colores de bordes iniciales */
        #bocchi { border: 5px solid #ff007f; }
        #kita   { border: 5px solid #ff2a2a; }
        #nijika { border: 5px solid #ffcc00; }
        #ryo    { border: 5px solid #00aaff; }

        /* === AJUSTES RESPONSIVOS PARA TELÉFONOS === */
        @media (max-width: 900px) { 
            body {
                display: flex !important; 
                flex-direction: column !important;
                justify-content: flex-start !important;
                overflow-y: auto !important; 
                padding: 15px !important;
                padding-right: 15px !important; 
                
                /* Centrado del bloque general en teléfonos */
                transform: translateX(-20px) !important;
                width: calc(100% + 20px) !important; 
            }

            .contenido-principal {
                padding-bottom: 10px;
                width: 100%;
            }

            .logo-titulo {
                height: 125px; 
                margin-top: 10px;
                transform: none !important; 
            }

            /* Estructura de cuadrícula estricta de 2x2 en móviles */
            .banda-container {
                display: grid !important;
                grid-template-columns: repeat(2, 1fr) !important; 
                gap: 12px !important; 
                margin-top: 15px !important;
                width: 100% !important;
                max-width: 360px !important; 
            }

            .tarjeta-miembro {
                padding: 6px !important; 
                box-sizing: border-box;
            }

            /* Ajuste de proporciones e imágenes cuadradas en móviles */
            .tarjeta-miembro img {
                width: 100% !important;
                height: auto !important;
                aspect-ratio: 1 / 1 !important; 
                object-fit: cover !important;   
                border-radius: 5px;
            }

            /* Configuración horizontal de las letras japonesas en móviles */
            .texto-vertical-derecha {
                writing-mode: horizontal-tb !important; 
                font-size: 2.8rem !important;      
                letter-spacing: 20px !important;   
                margin: 25px 0 25px 0 !important;  
                grid-column: unset !important; 
                align-self: center !important;
                text-shadow: 0 0 10px rgba(255, 251, 0, 0.6) !important;
                font-weight: 900 !important;       
            }

            .texto-vertical-derecha span {
                transform: scale(0.85); 
                margin-top: 0;
                display: inline-block;
            }
        }
    </style>
</head>
<body>

    <div class="contenido-principal">
        <img src="KESOKUBANDTITULOFUENTE.PNG" alt="KESSOKU BAND" class="logo-titulo">
        <p>Dale clic a cualquier integrante para escuchar su parte de la canción</p>

        <div class="banda-container">
            <!-- 1. BOCCHI -->
            <div class="tarjeta-miembro" id="bocchi" onclick="controlarAudio('audioBocchi', 'bocchi', '#ff007f')">
                <img src="bocchi.png" alt="Bocchi" width="200" height="200" style="object-fit: cover; border-radius: 5px;">
                <audio id="audioBocchi" src="bocchii.mp3"></audio>
            </div>

            <!-- 2. KITA -->
            <div class="tarjeta-miembro" id="kita" onclick="controlarAudio('audioKita', 'kita', '#ff2a2a')">
                <img src="kita.PNG" alt="Kita" width="200" height="200" style="object-fit: cover; border-radius: 5px;">
                <audio id="audioKita" src="seisyun-complex.mp3"></audio>
            </div>

            <!-- 3. NIJIKA -->
            <div class="tarjeta-miembro" id="nijika" onclick="controlarAudio('audioNijika', 'nijika', '#ffcc00')">
                <img src="NIJIKA.PNG" alt="Nijika" width="200" height="200" style="object-fit: cover; border-radius: 5px;">
                <audio id="audioNijika" src="guitar-lonelines.mp3"></audio>
            </div>

            <!-- 4. RYO -->
            <div class="tarjeta-miembro" id="ryo" onclick="controlarAudio('audioRyo', 'ryo', '#00aaff')">
                <img src="ryo.PNG" alt="Ryo" width="200" height="200" style="object-fit: cover; border-radius: 5px;">
                <audio id="audioRyo" src="if-i-couldm.mp3"></audio>
            </div>
        </div>
    </div>

    <!-- Letras japonesas del lateral -->
    <div class="texto-vertical-derecha">結束<span>バ</span><span>ン</span><span>ド</span></div>

    <!-- === CONTROLADOR DE REPRODUCCIÓN EN JAVASCRIPT === -->
    <script>
        function controlarAudio(idAudio, idCard, colorNeon) {
            const audioSeleccionado = document.getElementById(idAudio);
            const tarjetaSeleccionada = document.getElementById(idCard);

            // Control de volumen independiente por integrante
            if (idCard === 'bocchi') {
                audioSeleccionado.volume = 1.0;
            } else if (idCard === 'kita') {
                audioSeleccionado.volume = 0.30;
            } else if (idCard === 'nijika') {
                audioSeleccionado.volume = 0.30;
            } else if (idCard === 'ryo') {
                audioSeleccionado.volume = 0.35;
            }

            const todosLosAudios = document.querySelectorAll('audio');
            const todasLasTarjetas = document.querySelectorAll('.tarjeta-miembro');

            // Limpieza del neón al finalizar la reproducción de forma automática
            audioSeleccionado.addEventListener('ended', () => {
                tarjetaSeleccionada.style.boxShadow = "none";
            }, { once: true }); 

            if (audioSeleccionado.paused) {
                // Pausar y resetear todos los audios y neones activos
                todosLosAudios.forEach(aud => {
                    aud.pause();
                    aud.currentTime = 0; 
                });
                todasLasTarjetas.forEach(tar => tar.style.boxShadow = "none");

                // Activar audio y neón seleccionado
                audioSeleccionado.play();
                tarjetaSeleccionada.style.boxShadow = "0 0 35px " + colorNeon;

            } else {
                // Pausar y resetear al volver a pulsar sobre la tarjeta activa
                audioSeleccionado.pause();
                audioSeleccionado.currentTime = 0; 
                tarjetaSeleccionada.style.boxShadow = "none";
            }
        }
    </script>

</body>
</html>
